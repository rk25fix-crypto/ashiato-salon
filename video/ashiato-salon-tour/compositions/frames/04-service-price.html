  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "04-service-price";
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var S = 2 / 3; // plate px -> screen px
      var py = function (platePx) { return -platePx * S; };

      var plate = $("plate-layer");
      var ebG = $("eb-gallery"), ebS = $("eb-service"), ebP = $("eb-price");
      var hlG = $("hl-gallery"), hlS = $("hl-service"), hlP = $("hl-price");
      var chip = $("chip");

      var tl = gsap.timeline({ paused: true });

      // ── handoff_in state (t=0): plate at 5588, GALLERY / サロンのようす ──
      tl.set(plate, { y: py(5588) }, 0);
      tl.set([ebG, hlG], { opacity: 1, y: 0 }, 0);
      tl.set([ebS, hlS, ebP, hlP], { opacity: 0, y: 24 }, 0);
      tl.set(chip, { opacity: 0, scale: 0 }, 0);

      // ── Scene 1 (0.0–1.6s): plate glides 5588 → 7552 into SERVICE ──
      tl.fromTo(plate, { y: py(5588) }, { y: py(7552), duration: 1.6, ease: "power2.inOut" }, 0);

      // headline swap → SERVICE (old out-up, new in-up)
      tl.fromTo([ebG, hlG], { opacity: 1, y: 0 }, { opacity: 0, y: -24, duration: 0.25, ease: "power2.in", stagger: 0.03, immediateRender: false }, 0.6);
      tl.fromTo([ebS, hlS], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.05, immediateRender: false }, 0.82);

      // ── Scene 2 (1.6–2.6s): hold; paper chip pops (low overshoot) ──
      tl.fromTo(chip, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.4)", immediateRender: false }, 1.7);

      // ── Scene 3 (2.6–4.4s): plate glides 7552 → 11000; chip fades; swap → PRICE ──
      // ease-in (power 2.3) whose end velocity (~4400 plate px/s) matches Scene 4's power1.out start velocity,
      // so the scroll continues through 4.4s without a stall.
      var kA = 2.3;
      tl.fromTo(plate, { y: py(7552) }, {
        y: py(11000),
        duration: 1.8,
        immediateRender: false,
        ease: function (p) { return Math.pow(p, kA); }
      }, 2.6);
      tl.fromTo(chip, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out", immediateRender: false }, 2.7);

      tl.fromTo([ebS, hlS], { opacity: 1, y: 0 }, { opacity: 0, y: -24, duration: 0.25, ease: "power2.in", stagger: 0.03, immediateRender: false }, 3.62);
      tl.fromTo([ebP, hlP], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.05, immediateRender: false }, 3.84);

      // ── Scene 4 (4.4–5.4s): gentle continued read through the price rows 11000 → 13200 ──
      tl.fromTo(plate, { y: py(11000) }, { y: py(13200), duration: 1.0, ease: "power1.out", immediateRender: false }, 4.4);

      // ── Scene 5 (5.4–6.0s): hold on handoff_out state (plate 13200, PRICE) ──
      tl.set({}, {}, 6.0);

      window.__timelines[ID] = tl;
